[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fwagent"
version = "0.1.0"
description = "Deterministic first-pass IoT firmware analysis pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "DeepDuck" }
]
license = { text = "MIT" }
dependencies = []

[project.scripts]
fwagent = "fwagent.cli:main"

[tool.setuptools.packages.find]
include = ["fwagent*"]

